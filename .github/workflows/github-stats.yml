name: GitHub Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout stats generator
        uses: actions/checkout@v4
        with:
          repository: jstrieb/github-stats
          path: github-stats

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: github-stats
        run: pip install -r requirements.txt

      - name: Generate images
        working-directory: github-stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: codeaxworld
        run: python3 main.py

      - name: Commit generated images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p generated
          cp -r github-stats/generated/* generated/
          git add generated
          git diff --staged --quiet || git commit -m "Update GitHub stats"
          git push
